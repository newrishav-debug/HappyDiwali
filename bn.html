<!DOCTYPE html>
<html lang="bn">
<head>
<script>
// Old links from the GitHub Pages days move to the live site, keeping the sender's name.
if (location.hostname.endsWith('github.io')) {
  const n = new URLSearchParams(location.search).get('from');
  location.replace('https://happy-diwali-jet.vercel.app/' + (location.pathname.endsWith('bn.html') ? 'bn.html' : n ? 'from/' + encodeURIComponent(n) : ''));
}
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>শুভ দীপাবলি! Tap to Play</title>
<meta property="og:title" content="শুভ দীপাবলি">
<meta property="og:type" content="website">
<meta property="og:url" content="https://happy-diwali-jet.vercel.app/bn.html">
<meta property="og:image" content="https://happy-diwali-jet.vercel.app/preview-bn.jpg?v=6">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#17051f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪔</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <canvas id="sky" aria-label="রাতের আকাশে বাজি ফাটানোর খেলা"></canvas>
  <div id="toran"></div>
  <div id="hud" hidden>
    <div class="plaque" id="scoreBox"><small id="scoreLabel"></small><b id="score"></b></div>
    <div class="plaque" id="timeBox"><small id="timeLabel"></small><b id="time"></b></div>
  </div>
  <div id="switches">
    <button id="musicBtn" type="button" aria-pressed="true"><span aria-hidden="true">🎵</span></button>
    <button id="soundBtn" type="button" aria-pressed="true"><span aria-hidden="true">🔊</span></button>
  </div>
  <main id="panel">
    <img id="rangoli" src="art/rangoli.svg" alt="">
    <h1 id="title"></h1>
    <p id="from" hidden></p>
    <p id="tagline"></p>
    <div id="result" aria-live="polite" hidden><small id="overLabel"></small><b id="final"></b><span id="rank"></span></div>
    <ul id="legend"></ul>
    <div class="actions">
      <button id="play" type="button"></button>
      <a id="share" target="_blank" rel="noopener"></a>
    </div>
  </main>
</div>
<div id="turn" hidden><span aria-hidden="true">📱</span><p>খেলতে ফোনটা সোজা করে ধরো</p></div>
<script>
window.T = {
  locale: 'bn-IN', named: false,
  title: 'শুভ দীপাবলি', from: () => '',
  play: 'Tap to Play', again: 'আবার খেলো', score: 'স্কোর', time: 'সময়', over: 'তোমার স্কোর',
  share: 'Share in WhatsApp', musicOff: 'গান বন্ধ করো', musicOn: 'গান চালু করো', soundOff: 'শব্দ বন্ধ করো', soundOn: 'শব্দ চালু করো',
  invite: () => '',
  brag: s => `আমার স্কোর ${s}। পারলে হারাও!`,
  names: { chakri: 'চরকি', anar: 'তুবড়ি', rocket: 'রকেট', bomb: 'দোদমা', ladi: 'কালীপটকা', dud: 'ভেজা বাজি' },
  shouts: { chakri: 'বাহ!', anar: 'দারুণ!', rocket: 'সাঁই!', bomb: 'দুম!', ladi: 'ফটাফট!', dud: 'ফুস…' },
  ranks: [[0, 'ভেজা বাজি'], [300, 'ছোট পটকা'], [600, 'ফুলঝুরি তারকা'], [900, 'রকেট রাজা'], [1200, 'দোদমা সম্রাট']],
};
</script>
<script src="game.js"></script>
</body>
</html>
